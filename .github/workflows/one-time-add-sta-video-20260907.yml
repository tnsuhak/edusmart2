name: One-time add St. Thomas Aquinas video

on:
  push:
    branches: [seo-aeo-geo-polish-20260830]
    paths: ['.github/workflows/one-time-add-sta-video-20260907.yml']

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: seo-aeo-geo-polish-20260830
      - name: Add school video to St. Thomas Aquinas page
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('north-vancouver-private.html')
          s=p.read_text(encoding='utf-8')
          video_id='xLF4sxAazXY'
          if video_id not in s:
              marker='''  <section>\n    <span class="section-label">NORTH VANCOUVER LEARNING CENTRE</span>'''
              block='''  <section>\n    <span class="section-label">SCHOOL VIDEO</span>\n    <h2>영상으로 보는 St. Thomas Aquinas</h2>\n    <div class="video-wrap">\n      <iframe src="https://www.youtube.com/embed/xLF4sxAazXY" title="St. Thomas Aquinas Regional Secondary School 소개 영상" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" allowfullscreen loading="lazy"></iframe>\n    </div>\n  </section>\n\n'''+marker
              if marker not in s:
                  raise SystemExit('Learning centre section marker not found')
              s=s.replace(marker, block, 1)
              p.write_text(s, encoding='utf-8')
          if video_id not in p.read_text(encoding='utf-8'):
              raise SystemExit('Video insertion verification failed')
          PY
          git config user.name "tnsuhak"
          git config user.email "tnsuhak@gmail.com"
          git add north-vancouver-private.html
          if ! git diff --cached --quiet; then
            git commit -m "Add St. Thomas Aquinas school video"
            git push origin HEAD:seo-aeo-geo-polish-20260830
          fi
