name: One-time add North Vancouver detail cards

on:
  push:
    branches: [seo-aeo-geo-polish-20260830]
    paths: ['.github/workflows/one-time-add-northvan-detail-cards-20260907.yml']

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: seo-aeo-geo-polish-20260830
      - name: Add North Vancouver cards to detail directory
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          s=s.replace('<span class="cluster-count">안내 1 + 프로그램 6</span>', '<span class="cluster-count">안내 1 + 프로그램 8</span>')
          needle='''          <a href="burnaby.html"><div class="rg">BURNABY</div><div class="rn">아카데믹 관리형</div><div class="rd">도심 접근성 · 아카데믹 상담</div></a>'''
          insert=needle+'''\n          <a href="north-vancouver-public.html"><div class="rg">NORTH VANCOUVER · PUBLIC</div><div class="rn">공립 관리형</div><div class="rd">G9~11 · 공립 4개 학교 · 방과후 학습관리</div></a>\n          <a href="north-vancouver-private.html"><div class="rg">NORTH VANCOUVER · PRIVATE</div><div class="rn">사립 관리형</div><div class="rd">G9~11 · St. Thomas Aquinas · 방과후 학습관리</div></a>'''
          if 'north-vancouver-public.html"><div class="rg">NORTH VANCOUVER · PUBLIC' not in s:
              if needle not in s:
                  raise SystemExit('Burnaby detail card anchor not found')
              s=s.replace(needle, insert)
          p.write_text(s, encoding='utf-8')
          if '안내 1 + 프로그램 8' not in s or 'NORTH VANCOUVER · PUBLIC' not in s or 'NORTH VANCOUVER · PRIVATE' not in s:
              raise SystemExit('North Vancouver detail card update verification failed')
          PY
          git config user.name "tnsuhak"
          git config user.email "tnsuhak@gmail.com"
          git add index.html
          git commit -m "Add North Vancouver programs to detail directory"
          git push origin HEAD:seo-aeo-geo-polish-20260830
