name: One-time homepage date-only badge

on:
  push:
    branches: [seo-aeo-geo-polish-20260830]
    paths: ['.github/workflows/one-time-home-date-only-20260907.yml']

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: seo-aeo-geo-polish-20260830
      - name: Simplify homepage update badge
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          pat=re.compile(r'(<div\s+class="info-updated"[^>]*>\s*정보\s*업데이트\s+)(\d{4}\.\d{2}\.\d{2})(.*?)(</div>)', re.S)
          ns,n=pat.subn(lambda m:f'{m.group(1)}{m.group(2)}{m.group(4)}',s, count=1)
          if n != 1:
              raise SystemExit('Homepage update badge not found or ambiguous')
          p.write_text(ns,encoding='utf-8')
          m=re.search(r'<div\s+class="info-updated"[^>]*>(.*?)</div>',ns,re.S)
          text=re.sub(r'<[^>]+>','',m.group(1)).strip() if m else ''
          if not re.fullmatch(r'정보\s*업데이트\s+\d{4}\.\d{2}\.\d{2}',text):
              raise SystemExit(f'Unexpected homepage badge: {text!r}')
          print('Homepage badge:',text)
          PY
          git config user.name "tnsuhak"
          git config user.email "tnsuhak@gmail.com"
          git add index.html
          git commit -m "Simplify homepage update badge to date only"
          git push origin HEAD:seo-aeo-geo-polish-20260830
