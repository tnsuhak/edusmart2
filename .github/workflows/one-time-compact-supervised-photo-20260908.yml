name: Compact supervised dorm photo

on:
  push:
    branches:
      - meeting-insights-20260908
    paths:
      - .github/workflows/one-time-compact-supervised-photo-20260908.yml

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: meeting-insights-20260908
      - name: Reduce supervised dorm photo display size
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('style.css')
          s = p.read_text(encoding='utf-8')
          marker = '/* supervised dorm collage compact */'
          if marker not in s:
              s += '''\n\n/* supervised dorm collage compact */\n.gallery-hero[style*="max-height:none"]{\n  width:78%;\n  max-width:420px;\n  height:auto;\n  max-height:none !important;\n  margin-left:auto;\n  margin-right:auto;\n  object-fit:contain;\n}\n@media (max-width:480px){\n  .gallery-hero[style*="max-height:none"]{width:78%;max-width:390px;}\n}\n'''
              p.write_text(s, encoding='utf-8')
          PY
          git config user.name tnsuhak
          git config user.email tnsuhak@gmail.com
          git add style.css
          git rm .github/workflows/one-time-compact-supervised-photo-20260908.yml
          git commit -m "Reduce supervised dormitory photo display size"
          git push origin HEAD:meeting-insights-20260908
