name: One-time shorten golf finder copy

on:
  push:
    branches: [seo-aeo-geo-polish-20260830]
    paths: ['.github/workflows/one-time-shorten-golf-finder-20260907.yml']

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: seo-aeo-geo-polish-20260830
      - name: Shorten golf finder copy
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('nav.js')
          s=p.read_text(encoding='utf-8')
          old="""    var golfHtml = golfOption ?
      '<div class=\"finder-warning\"><b>⛳ 골프를 병행하고 싶다면?</b> 일반 관리 수준 추천과는 별도로 <b>' + escapeHtml(golfOption.name) + '</b>도 가능합니다. 골프 훈련비가 포함되어 연간 비용은 ' + escapeHtml(golfOption.cost) + '입니다. <a href=\"' + escapeHtml(golfOption.href) + '\"><b>골프 프로그램 보기 →</b></a></div>' : '';"""
          new="""    var golfHtml = golfOption ?
      '<div class=\"finder-warning\"><b>⛳ 골프를 병행하고 싶다면?</b> 관리 수준 추천과는 별도로 <b>' + escapeHtml(golfOption.name) + '</b>도 가능합니다. <a href=\"' + escapeHtml(golfOption.href) + '\"><b>골프 프로그램 보기 →</b></a></div>' : '';"""
          if old not in s:
              raise SystemExit('Target golf finder copy not found')
          s=s.replace(old,new,1)
          p.write_text(s,encoding='utf-8')
          assert '골프 훈련비가 포함되어 연간 비용은' not in s
          print('Golf finder copy shortened')
          PY
          git config user.name "tnsuhak"
          git config user.email "tnsuhak@gmail.com"
          git add nav.js
          git commit -m "Shorten golf finder recommendation copy"
          git push origin HEAD:seo-aeo-geo-polish-20260830
