name: One-time North Vancouver finder care

on:
  push:
    branches: [seo-aeo-geo-polish-20260830]
    paths: ['.github/workflows/one-time-northvan-finder-care-20260907.yml']

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: seo-aeo-geo-polish-20260830
      - name: Include North Vancouver in care levels 2 and 3
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('nav.js')
          s=p.read_text(encoding='utf-8')

          old_pub="{name:'노스밴쿠버 공립 아카데믹 관리형', minGrade:9, maxGrade:11, minCost:71700, cost:'CA$71,700', care:2, href:'north-vancouver-public.html'"
          new_pub="{name:'노스밴쿠버 공립 아카데믹 관리형', minGrade:9, maxGrade:11, minCost:71700, cost:'CA$71,700', care:[2,3], href:'north-vancouver-public.html'"
          old_pri="{name:'노스밴쿠버 사립 아카데믹 관리형', minGrade:9, maxGrade:11, minCost:82375, cost:'CA$82,375', care:2, href:'north-vancouver-private.html'"
          new_pri="{name:'노스밴쿠버 사립 아카데믹 관리형', minGrade:9, maxGrade:11, minCost:82375, cost:'CA$82,375', care:[2,3], href:'north-vancouver-private.html'"
          if old_pub not in s or old_pri not in s:
              raise SystemExit('North Vancouver program definitions not found')
          s=s.replace(old_pub,new_pub,1).replace(old_pri,new_pri,1)

          marker="""  function golfProgramsForGrade(grade) {\n    return programs.filter(function (program) {\n      return program.special === 'golf' && grade >= program.minGrade && grade <= program.maxGrade;\n    });\n  }\n"""
          helper=marker+"""\n  function programMatchesCare(program, care) {\n    return Array.isArray(program.care) ? program.care.indexOf(care) !== -1 : program.care === care;\n  }\n"""
          if 'function programMatchesCare' not in s:
              if marker not in s:
                  raise SystemExit('Care helper insertion marker not found')
              s=s.replace(marker,helper,1)

          old1="""      option.disabled = !candidates.some(function (program) {\n        return program.care === care;\n      });"""
          new1="""      option.disabled = !candidates.some(function (program) {\n        return programMatchesCare(program, care);\n      });"""
          if old1 in s:
              s=s.replace(old1,new1,1)
          elif 'return programMatchesCare(program, care);' not in s:
              raise SystemExit('syncCareOptions match not found')

          old2="""    var eligible = generalProgramsForGrade(grade).filter(function (program) {\n      return program.minCost <= budget && program.care === care;\n    });"""
          new2="""    var eligible = generalProgramsForGrade(grade).filter(function (program) {\n      return program.minCost <= budget && programMatchesCare(program, care);\n    });"""
          if old2 in s:
              s=s.replace(old2,new2,1)
          elif 'program.minCost <= budget && programMatchesCare(program, care)' not in s:
              raise SystemExit('eligible care match not found')

          p.write_text(s,encoding='utf-8')

          # Verification for G10 / high budget / care level 3.
          assert "care:[2,3], href:'north-vancouver-public.html'" in s
          assert "care:[2,3], href:'north-vancouver-private.html'" in s
          assert 'function programMatchesCare' in s
          print('North Vancouver finder logic updated for care levels 2 and 3')
          PY
          git config user.name "tnsuhak"
          git config user.email "tnsuhak@gmail.com"
          git add nav.js
          git commit -m "Include North Vancouver in higher-care finder results"
          git push origin HEAD:seo-aeo-geo-polish-20260830
