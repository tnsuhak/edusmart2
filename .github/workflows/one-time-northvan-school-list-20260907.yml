name: One-time North Vancouver school list sync
on:
  push:
    branches: [seo-aeo-geo-polish-20260830]
    paths: ['.github/workflows/one-time-northvan-school-list-20260907.yml']
permissions:
  contents: write
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: seo-aeo-geo-polish-20260830
      - name: Sync North Vancouver public school list
        run: |
          python3 - <<'PY'
          from pathlib import Path
          for p in Path('.').glob('*.html'):
              s = p.read_text(encoding='utf-8')
              s = s.replace('Handsworth / Argyle / Sutherland', 'Handsworth / Argyle / Sutherland / Carson Graham')
              s = s.replace('Handsworth·Argyle·Sutherland · CA$71,700', 'Handsworth·Argyle·Sutherland·Carson Graham · CA$71,700')
              s = s.replace('G9~11 · Handsworth·Argyle·Sutherland</small>', 'G9~11 · 공립 4개 학교</small>')
              p.write_text(s, encoding='utf-8')
          PY
          git config user.name "TNS Site Manager"
          git config user.email "actions@users.noreply.github.com"
          git add '*.html'
          git diff --cached --quiet && exit 0
          git commit -m "Sync North Vancouver four-school listing"
          git push origin HEAD:seo-aeo-geo-polish-20260830
