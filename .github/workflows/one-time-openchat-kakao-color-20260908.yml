name: One-time openchat Kakao color

on:
  push:
    branches:
      - seo-aeo-geo-polish-20260830
    paths:
      - .github/workflows/one-time-openchat-kakao-color-20260908.yml

permissions:
  contents: write

jobs:
  update-color:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: seo-aeo-geo-polish-20260830
      - name: Match openchat card to Kakao consultation color
        shell: bash
        run: |
          python3 -c "from pathlib import Path; p=Path('style.css'); s=p.read_text(encoding='utf-8'); s=s.replace('#FFF4B8','#FEE500').replace('#E7CF58','#F2D900').replace('#3C2D12','#3C1E1E').replace('#74633D','#6B5A38'); p.write_text(s,encoding='utf-8')"
          git config user.name tnsuhak
          git config user.email tnsuhak@gmail.com
          git add style.css
          git rm .github/workflows/one-time-openchat-kakao-color-20260908.yml
          git commit -m 'Match openchat card color to Kakao consultation'
          git push origin HEAD:seo-aeo-geo-polish-20260830
