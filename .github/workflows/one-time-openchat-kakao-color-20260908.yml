name: One-time openchat Kakao color

on:
  push:
    branches:
      - seo-aeo-geo-polish-20260830
    paths:
      - .github/workflows/one-time-openchat-kakao-color-20260908.yml

permissions:
  contents: write

jobs:
  update-color:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: seo-aeo-geo-polish-20260830
      - name: Match openchat card to Kakao consultation color
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('style.css')
          s = p.read_text(encoding='utf-8')
          old = '''.cta-btns a.openchat{background:#FFF4B8; border-color:#E7CF58;}
.cta-btns a.openchat .lb{color:#3C2D12;}
.cta-btns a.openchat .sb{color:#74633D;}'''
          new = '''.cta-btns a.openchat{background:#FEE500; border-color:#F2D900;}
.cta-btns a.openchat .lb{color:#3C1E1E;}
.cta-btns a.openchat .sb{color:#6B5A38;}'''
          if old not in s:
              raise SystemExit('Openchat color block not found')
          p.write_text(s.replace(old,new,1), encoding='utf-8')
          PY
          git config user.name tnsuhak
          git config user.email tnsuhak@gmail.com
          git add style.css
          git rm .github/workflows/one-time-openchat-kakao-color-20260908.yml
          git commit -m 'Match openchat card color to Kakao consultation'
          git push origin HEAD:seo-aeo-geo-polish-20260830
