name: One-time final visible source cleanup

on:
  push:
    branches: [seo-aeo-geo-polish-20260830]
    paths: ['.github/workflows/one-time-final-visible-source-cleanup-20260907.yml']

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: seo-aeo-geo-polish-20260830
      - name: Remove all visible source attribution markers
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          terms=['자료 출처','공식 출처','참고 자료','에듀스마트 제공','에듀스마트 공식 소개 영상']
          changed=[]
          for p in Path('.').glob('*.html'):
              s=p.read_text(encoding='utf-8')
              before=s
              # Dedicated source/reference sections.
              s=re.sub(r'\n\s*<section[^>]*>.*?<span class="section-label">\s*(?:자료\s*출처|공식\s*출처|참고\s*자료)\s*</span>.*?</section>', '', s, flags=re.S|re.I)
              # Footer/source lines that start with a visible label.
              s=re.sub(r'\s*(?:자료\s*출처|공식\s*출처|참고\s*자료)\s*:\s*<a\b[^>]*>.*?</a>\s*<br>\s*', '\n      ', s, flags=re.S|re.I)
              s=re.sub(r'\s*(?:자료\s*출처|공식\s*출처|참고\s*자료)\s*:\s*.*?<br>\s*', '\n      ', s, flags=re.S|re.I)
              # Cases where the label itself is inside an anchor.
              s=re.sub(r'\s*<a\b[^>]*>\s*(?:자료\s*출처|공식\s*출처|참고\s*자료)\s*:.*?</a>\s*', '\n      ', s, flags=re.S|re.I)
              # Remove source-credit phrasing from photo/video captions while keeping the media.
              s=s.replace('에듀스마트가 제공한 실제 프로그램 사진입니다','실제 프로그램 사진입니다')
              s=s.replace(' · 에듀스마트 제공','')
              s=s.replace('에듀스마트 제공 · ','')
              s=s.replace('에듀스마트 공식 소개 영상','프로그램 소개 영상')
              if s!=before:
                  p.write_text(s,encoding='utf-8')
                  changed.append(p.name)

          remaining=[]
          for p in Path('.').glob('*.html'):
              s=p.read_text(encoding='utf-8')
              for term in terms:
                  if term in s:
                      remaining.append((p.name,term))
          print('Changed files:', changed)
          print('Remaining attribution markers:', remaining)
          if remaining:
              raise SystemExit('visible attribution markers remain')
          PY
          git config user.name "tnsuhak"
          git config user.email "tnsuhak@gmail.com"
          git add '*.html'
          if ! git diff --cached --quiet; then
            git commit -m "Remove visible source attribution across EduSmart site"
            git push origin HEAD:seo-aeo-geo-polish-20260830
          fi
