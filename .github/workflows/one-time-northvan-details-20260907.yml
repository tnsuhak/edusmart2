          def replace_section(text, label, replacement, next_label):
              pat = rf'  <section>\s*<span class="section-label">{re.escape(label)}</span>[\s\S]*?</section>\s*(?=  <section>\s*<span class="section-label">{re.escape(next_label)}</span>)'
              new, n = re.subn(pat, replacement + '\n', text, count=1)
              if n != 1:
                  raise SystemExit(f'Could not replace section {label} before {next_label}')
              return new

          # PUBLIC PAGE
