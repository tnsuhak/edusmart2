@media (max-width:480px){
  .table-scroll::after{content:'← 좌우로 밀어 시간표 확인 →'; display:block; text-align:center; font-size:10px; color:var(--muted); padding-top:6px;}
  .schedule-table{font-size:10px;}
}
'''
              cssp.write_text(css, encoding='utf-8')

          # Assertions for the important user-supplied details.
          pub = Path('north-vancouver-public.html').read_text(encoding='utf-8')
          prv = Path('north-vancouver-private.html').read_text(encoding='utf-8')
          assert '주 3회 방과후 수업' in pub and '주 3회 방과후 수업' in prv
          assert 'Evidence-based Reading & Writing' in pub and 'Digital SAT Reading & Writing' in prv
          assert 'Carson Graham Secondary' in pub
          assert 'CA$71,700' in pub
