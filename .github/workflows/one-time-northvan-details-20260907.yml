          s = p.read_text(encoding='utf-8')
          s = s.replace('Handsworth, Argyle, Sutherland 공립학교와 캐네디언 홈스테이, 에듀스마트 학업 관리를 결합한 2026-27 프로그램. 10개월 CA$71,700.', 'Handsworth·Argyle·Sutherland·Carson Graham 공립학교와 캐네디언 홈스테이, 주 3회 방과후 소그룹 학업관리를 결합한 2026-27 프로그램. 10개월 CA$71,700.')
          s = s.replace('Handsworth·Argyle·Sutherland + 홈스테이 + 아카데믹 관리, 10개월 CA$71,700.', '공립 4개 학교 + 홈스테이 + 주 3회 방과후 아카데믹 관리, 10개월 CA$71,700.')
          s = s.replace('학교 선택은 Handsworth Secondary, Argyle Secondary, Sutherland Secondary를 중심으로 검토하며 실제 배정 가능 여부는 지원 시점에 확인합니다.', '학교 선택은 Handsworth, Argyle, Sutherland, Carson Graham을 중심으로 검토하며 실제 배정 가능 여부는 지원 시점에 확인합니다.')
          s = s.replace('<div class="value">Handsworth · Argyle · Sutherland</div>', '<div class="value">Handsworth · Argyle · Sutherland · Carson Graham</div>')
          # Insert academic detail before school section.
          if '<!-- NORTHVAN-ACADEMIC-DETAILS -->' not in s:
              s = s.replace('  <section>\n    <span class="section-label">SCHOOL OPTIONS</span>', common_academic + '\n  <section>\n    <span class="section-label">SCHOOL OPTIONS</span>', 1)
          s = replace_section(s, 'SCHOOL OPTIONS', public_school.strip(), 'COST')
          s = replace_section(s, 'COST', public_cost.strip(), 'FAQ')
          s = replace_section(s, 'FAQ', public_faq.strip(), 'RELATED')
          s = s.replace('학교 확인: <a href="https://handsworth.sd44.ca/" target="_blank" rel="noopener">Handsworth Secondary</a> · <a href="https://argyle.sd44.ca/" target="_blank" rel="noopener">Argyle Secondary</a> · <a href="https://sutherland.sd44.ca/" target="_blank" rel="noopener">Sutherland Secondary</a>. 프로그램 대상·비용은 2026년 9월 3일 에듀스마트 최신 비용표 기준입니다.', '프로그램 운영·시간표·학습센터·서비스: 에듀스마트 노스밴쿠버 아카데믹 관리형 안내. 학교 확인: <a href="https://handsworth.sd44.ca/" target="_blank" rel="noopener">Handsworth</a> · <a href="https://argyle.sd44.ca/" target="_blank" rel="noopener">Argyle</a> · <a href="https://sutherland.sd44.ca/" target="_blank" rel="noopener">Sutherland</a> · Carson Graham. 프로그램 대상·비용은 2026년 9월 3일 에듀스마트 최신 비용표 기준입니다.')
          p.write_text(s, encoding='utf-8')

          # PRIVATE PAGE
          p = Path('north-vancouver-private.html')
          s = p.read_text(encoding='utf-8')
          s = s.replace('캐네디언 홈스테이와 에듀스마트 학업 관리, 2026-27 10개월 CA$82,375.', '캐네디언 홈스테이와 주 3회 방과후 소그룹 학업 관리, 2026-27 10개월 CA$82,375.')
          s = s.replace('St. Thomas Aquinas Regional Secondary + 홈스테이 + 아카데믹 관리, 10개월 CA$82,375.', 'St. Thomas Aquinas + 홈스테이 + 주 3회 방과후 아카데믹 관리, 10개월 CA$82,375.')
