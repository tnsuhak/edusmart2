      <details class="faq-item"><summary><span class="q-badge">Q4</span>사립 노스밴쿠버 프로그램과 가장 큰 차이는 무엇인가요?</summary><div class="a">공립 과정은 4개 공립학교를 중심으로 검토하며 10개월 <b>CA$71,700</b>입니다. 사립 과정은 St. Thomas Aquinas를 이용하며 <b>CA$82,375</b>입니다. 두 과정 모두 주 3회 방과후 수업과 홈스테이·풀가디언 관리가 포함됩니다.</div></details>
