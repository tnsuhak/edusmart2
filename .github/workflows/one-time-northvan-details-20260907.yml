      <details class="faq-item"><summary><span class="q-badge">Q3</span>CA$82,375에 의료보험도 포함되나요?</summary><div class="a">아닙니다. <b>St. Thomas Aquinas 의료보험료는 별도</b>입니다. 학비·캐네디언 홈스테이·주 3회 방과후 수업·풀가디언 비용이 기본 포함 항목입니다.</div></details>
