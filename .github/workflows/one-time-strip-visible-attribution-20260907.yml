name: One-time strip visible attribution

on:
  push:
    branches: [seo-aeo-geo-polish-20260830]
    paths: ['.github/workflows/one-time-strip-visible-attribution-20260907.yml']

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: seo-aeo-geo-polish-20260830
      - name: Remove source attribution from public EduSmart pages
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          changed=[]
          for p in Path('.').glob('*.html'):
              s=p.read_text(encoding='utf-8')
              before=s
              # Footer/source lines such as: 자료 출처: <a ...>...</a><br>
              s=re.sub(r'\s*자료\s*출처\s*:\s*.*?<br>\s*', '\n      ', s, flags=re.S|re.I)
              s=re.sub(r'\s*공식\s*출처\s*:\s*.*?<br>\s*', '\n      ', s, flags=re.S|re.I)
              s=re.sub(r'\s*참고\s*자료\s*:\s*.*?<br>\s*', '\n      ', s, flags=re.S|re.I)
              # Any dedicated visible source/reference section variants.
              s=re.sub(r'\n\s*<section[^>]*>.*?<span class="section-label">\s*(?:자료\s*출처|공식\s*출처|참고\s*자료)\s*</span>.*?</section>', '', s, flags=re.S|re.I)
              # Photo/video attribution wording: keep the content but remove source-credit phrasing.
              s=s.replace('에듀스마트가 제공한 실제 프로그램 사진입니다','실제 프로그램 사진입니다')
              s=s.replace(' · 에듀스마트 제공','')
              s=s.replace('에듀스마트 제공 · ','')
              s=s.replace('에듀스마트 공식 소개 영상','프로그램 소개 영상')
              if s!=before:
                  p.write_text(s,encoding='utf-8')
                  changed.append(p.name)

          print('Changed files:', changed)
          terms=['자료 출처','공식 출처','참고 자료','에듀스마트 제공','에듀스마트 공식 소개 영상']
          remaining=[]
          for p in Path('.').glob('*.html'):
              s=p.read_text(encoding='utf-8')
              for term in terms:
                  if term in s:
                      remaining.append((p.name,term))
          print('Remaining attribution markers:', remaining)
          if remaining:
              raise SystemExit('visible attribution markers remain')
          PY
          git config user.name "tnsuhak"
          git config user.email "tnsuhak@gmail.com"
          git add '*.html'
          if ! git diff --cached --quiet; then
            git commit -m "Strip visible source attribution from EduSmart pages"
            git push origin HEAD:seo-aeo-geo-polish-20260830
          fi
