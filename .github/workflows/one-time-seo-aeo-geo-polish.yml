name: One-time SEO AEO GEO polish

on:
  push:
    branches:
      - seo-aeo-geo-polish-20260830
    paths:
      - '.github/workflows/one-time-seo-aeo-geo-polish.yml'

permissions:
  contents: write

jobs:
  polish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: seo-aeo-geo-polish-20260830
      - name: Apply SEO AEO GEO polish
        run: |
          python - <<'PY'
          from pathlib import Path
          import json, re

          pages = {
            'index.html': '캐나다 밴쿠버 조기유학 11개 선택지 비교',
            'supervised.html': '캐나다 관리형 유학 안내',
            'dorm-young.html': '코퀴틀람 기숙사 관리형 유학 Grade 5~7',
            'dorm-junior.html': '코퀴틀람 기숙사 관리형 유학 Grade 7~11',
            'homestay.html': '코퀴틀람 홈스테이 관리형 유학',
            'golf.html': '코퀴틀람 주니어 골프 관리형 유학',
            'langley.html': '랭리 홈스테이 관리형 유학',
            'burnaby.html': '버나비 홈스테이 관리형 유학',
            'guardian.html': '캐나다 가디언형 유학 안내',
            'guardian-metro.html': '버나비·랭리·코퀴틀람 가디언형 유학',
            'guardian-chilliwack.html': '칠리왁 공립교육청 가디언형 유학',
            'guardian-highroad.html': '하이로드 아카데미 가디언형 유학',
          }
          semantic_level_pages = {
            'supervised.html','golf.html','guardian.html','guardian-metro.html','guardian-highroad.html'
          }
          base = 'https://edusmart-ca.netlify.app/'
          favicon = '<link rel="icon" href="/favicon.svg" type="image/svg+xml">\n<meta name="theme-color" content="#F4D717">'
          updated = '<div class="info-updated">정보 업데이트 2026.08.30 · 2026–27 학년도 프로그램 비용 및 운영 정보 기준</div>'

          for filename, label in pages.items():
            p = Path(filename)
            text = p.read_text(encoding='utf-8')

            if 'href="/favicon.svg"' not in text:
              text = text.replace('<link rel="stylesheet" href="style.css">', favicon + '\n<link rel="stylesheet" href="style.css">', 1)

            if 'class="info-updated"' not in text:
              text = re.sub(r'(<div class="hero(?: [^"]*)?">)', r'\1\n    ' + updated, text, count=1)

            if filename in semantic_level_pages:
              text = re.sub(r'<h4(?![^>]*aria-level=)([^>]*)>', r'<h4 role="heading" aria-level="3"\1>', text)

            url = base if filename == 'index.html' else base + filename
            if filename == 'index.html':
              if '"logo": "https://edusmart-ca.netlify.app/favicon.svg"' not in text:
                text = text.replace('"url": "https://www.tnsuhak.com/"\n    }', '"url": "https://www.tnsuhak.com/",\n      "logo": "https://edusmart-ca.netlify.app/favicon.svg"\n    }', 1)
            else:
              marker = '"@type": "BreadcrumbList"'
              if marker not in text:
                schema = {
                  "@context": "https://schema.org",
                  "@graph": [
                    {
                      "@type": "WebPage",
                      "name": label,
                      "url": url,
                      "inLanguage": "ko-KR",
                      "isPartOf": {"@type":"WebSite","name":"TNS유학 캐나다 조기유학 프로그램 비교","url":base},
                      "publisher": {"@type":"Organization","name":"TNS유학","url":"https://www.tnsuhak.com/","logo":base+'favicon.svg'},
                      "dateModified": "2026-08-30"
                    },
                    {
                      "@type": "BreadcrumbList",
                      "itemListElement": [
                        {"@type":"ListItem","position":1,"name":"캐나다 조기유학 프로그램 비교","item":base},
                        {"@type":"ListItem","position":2,"name":label,"item":url}
                      ]
                    }
                  ]
                }
                block = '<script type="application/ld+json">\n' + json.dumps(schema, ensure_ascii=False, indent=2) + '\n</script>\n'
                text = text.replace('</head>', block + '</head>', 1)

            p.write_text(text, encoding='utf-8')

          css = Path('style.css')
          c = css.read_text(encoding='utf-8')
          if '.info-updated{' not in c:
            c += '''\n\n/* GEO/AEO freshness marker */\n.info-updated{\n  position:relative; z-index:1;\n  display:inline-block; margin:0 0 12px; padding:4px 9px;\n  border:1px solid rgba(255,255,255,.20); border-radius:999px;\n  background:rgba(255,255,255,.07); color:#C9D2DF;\n  font-size:10px; line-height:1.4; letter-spacing:.01em;\n}\n@media (max-width:480px){.info-updated{font-size:9.5px; margin-bottom:10px;}}\n'''
          css.write_text(c, encoding='utf-8')
          PY
      - name: Commit changes and remove workflow
        run: |
          rm .github/workflows/one-time-seo-aeo-geo-polish.yml
          git config user.name "TNS Site Manager"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "Polish SEO AEO GEO semantics and favicon"
          git push origin HEAD:seo-aeo-geo-polish-20260830
