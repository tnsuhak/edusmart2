name: One-time simplify North Vancouver grade copy

on:
  push:
    branches: [seo-aeo-geo-polish-20260830]
    paths: ['.github/workflows/one-time-simplify-northvan-grade-copy-20260907.yml']

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: seo-aeo-geo-polish-20260830
      - name: Simplify customer-facing grade wording
        run: |
          python3 - <<'PY'
          from pathlib import Path

          replacements = {
            'north-vancouver-public.html': [
              ('현재 TNS 사이트는 2026년 9월 3일 최신 비용표를 기준으로 <b>Grade 9~11</b>을 대상으로 안내합니다.', '<b>Grade 9~11학년까지 가능합니다.</b>')
            ],
            'north-vancouver-private.html': [
              ('St. Thomas Aquinas 학교 자체는 Grade 8~12를 운영하지만 현재 TNS 사이트는 9월 3일 최신 비용표에 따라 관리형 프로그램 대상을 Grade 9~11로 안내합니다.', '관리형 프로그램은 <b>Grade 9~11학년까지 가능합니다.</b>')
            ]
          }

          changed = []
          for filename, pairs in replacements.items():
              p = Path(filename)
              s = p.read_text(encoding='utf-8')
              original = s
              for old, new in pairs:
                  if old not in s:
                      raise SystemExit(f'Target text not found in {filename}: {old}')
                  s = s.replace(old, new, 1)
              if s != original:
                  p.write_text(s, encoding='utf-8')
                  changed.append(filename)

          print('Updated:', ', '.join(changed))
          PY
          git config user.name "tnsuhak"
          git config user.email "tnsuhak@gmail.com"
          git add north-vancouver-public.html north-vancouver-private.html
          git commit -m "Simplify North Vancouver grade wording"
          git push origin HEAD:seo-aeo-geo-polish-20260830
