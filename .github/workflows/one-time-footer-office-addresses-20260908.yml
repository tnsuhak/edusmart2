name: One-time footer office addresses

on:
  push:
    branches:
      - seo-aeo-geo-polish-20260830
    paths:
      - .github/workflows/one-time-footer-office-addresses-20260908.yml

permissions:
  contents: write

jobs:
  update-footer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: seo-aeo-geo-polish-20260830
      - name: Update footers
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import base64

          encoded = ''
          new_footer = base64.b64decode(encoded).decode('utf-8')
          changed = []

          for path in Path('.').glob('*.html'):
              text = path.read_text(encoding='utf-8')
              start = text.find('<footer>')
              tags = text.find('<div class="ft-tags">', start)
              if start < 0 or tags < 0:
                  continue
              updated = text[:start] + new_footer + text[tags:]
              if updated != text:
                  path.write_text(updated, encoding='utf-8')
                  changed.append(path.name)

          if not changed:
              raise SystemExit('No HTML footer was updated')
          print('Updated', len(changed), 'files')
          PY
          git config user.name tnsuhak
          git config user.email tnsuhak@gmail.com
          git add '*.html'
          git rm .github/workflows/one-time-footer-office-addresses-20260908.yml
          git commit -m 'Show Seoul and Busan addresses in footer'
          git push origin HEAD:seo-aeo-geo-polish-20260830
