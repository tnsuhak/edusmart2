name: One-time enlarge top contact labels

on:
  push:
    branches:
      - seo-aeo-geo-polish-20260830
    paths:
      - .github/workflows/one-time-enlarge-top-contact-labels-20260908.yml

permissions:
  contents: write

jobs:
  enlarge-labels:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: seo-aeo-geo-polish-20260830
      - name: Enlarge Kakao and phone consultation labels only
        shell: bash
        run: |
          printf '%s\n' '' '/* Top consultation cards: slightly larger primary labels */' '.cta-btns-top a .lb{font-size:13px;}' '@media (max-width:480px){.cta-btns-top a .lb{font-size:12.2px;}}' >> style.css
          git config user.name tnsuhak
          git config user.email tnsuhak@gmail.com
          git add style.css
          git rm .github/workflows/one-time-enlarge-top-contact-labels-20260908.yml
          git commit -m 'Slightly enlarge top consultation labels'
          git push origin HEAD:seo-aeo-geo-polish-20260830
