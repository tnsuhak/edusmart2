name: One-time North Vancouver content polish

on:
  push:
    branches: [seo-aeo-geo-polish-20260830]
    paths:
      - '.github/workflows/one-time-north-vancouver-polish-20260907.yml'

permissions:
  contents: write

jobs:
  polish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: seo-aeo-geo-polish-20260830
          fetch-depth: 0
      - name: Fix stale counts and wording
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          s = s.replace('관리형 6개와 가디언형 5개', '관리형 8개와 가디언형 5개')
          s = s.replace('코퀴틀람·랭리·버나비·칠리왁', '코퀴틀람·랭리·버나비·노스밴쿠버·칠리왁')
          s = s.replace('코퀴틀람 · 랭리 · 버나비 · 칠리왁', '코퀴틀람 · 랭리 · 버나비 · 노스밴쿠버 · 칠리왁')
          p.write_text(s, encoding='utf-8')

          p = Path('supervised.html')
          s = p.read_text(encoding='utf-8').replace('6개 프로그램과 함께 비교합니다.', '8개 프로그램과 함께 비교합니다.')
          p.write_text(s, encoding='utf-8')

          p = Path('north-vancouver-private.html')
          s = p.read_text(encoding='utf-8')
          s = s.replace('학교 공식 안내에 따르면 비가톨릭 또는 종교 배경이 없는 학생도 Christian Education 과목을 이수해야 하며, 수업 참여에 불이익이 없도록 안내하고 있습니다.', '비가톨릭 또는 종교 배경이 없는 학생도 Christian Education 과목을 이수해야 하며, 수업 참여에 불이익 없이 과정을 이수할 수 있습니다.')
          s = s.replace('학교 공식 안내상 <b>비가톨릭 학생도 재학할 수 있습니다.</b>', '<b>비가톨릭 학생도 재학할 수 있습니다.</b>')
          p.write_text(s, encoding='utf-8')

          # Verify stale public-facing counts are gone from core pages.
          core = '\n'.join(Path(f).read_text(encoding='utf-8') for f in ['index.html','supervised.html'])
          assert '관리형 6개와 가디언형 5개' not in core
          assert '6개 프로그램과 함께 비교합니다.' not in core
          assert '노스밴쿠버' in Path('index.html').read_text(encoding='utf-8')

          Path('.github/workflows/one-time-north-vancouver-polish-20260907.yml').unlink(missing_ok=True)
          PY
          git config user.name "TNS Site Manager"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "Polish North Vancouver expansion copy"
          git push origin HEAD:seo-aeo-geo-polish-20260830
