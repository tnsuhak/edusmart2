name: One-time Highroad label update

on:
  push:
    branches:
      - seo-aeo-geo-polish-20260830
    paths:
      - '.github/workflows/one-time-highroad-label.yml'

permissions:
  contents: write

jobs:
  update-labels:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: seo-aeo-geo-polish-20260830
      - name: Update Highroad naming consistently
        run: |
          python - <<'PY'
          from pathlib import Path

          for p in Path('.').glob('*.html'):
              s = p.read_text(encoding='utf-8')
              s = s.replace('>하이로드 아카데미<small>', '>칠리왁 하이로드 아카데미<small>')
              s = s.replace('<summary>하이로드 아카데미 <span', '<summary>칠리왁 하이로드 아카데미 <span')
              p.write_text(s, encoding='utf-8')

          p = Path('guardian-highroad.html')
          s = p.read_text(encoding='utf-8')
          s = s.replace('<title>하이로드 아카데미 가디언형 유학', '<title>칠리왁 하이로드 아카데미 가디언형 유학')
          s = s.replace('content="하이로드 아카데미 가디언형 유학 (Grade 8~11)"', 'content="칠리왁 하이로드 아카데미 가디언형 유학 (Grade 8~11)"')
          s = s.replace('"name": "하이로드 아카데미 가디언형 유학"', '"name": "칠리왁 하이로드 아카데미 가디언형 유학"')
          s = s.replace('<h1>하이로드 아카데미<br>', '<h1>칠리왁 하이로드 아카데미<br>')
          p.write_text(s, encoding='utf-8')
          PY
      - name: Commit changes and remove workflow
        run: |
          rm .github/workflows/one-time-highroad-label.yml
          git config user.name "TNS Site Manager"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "Clarify Highroad Academy as Chilliwack program"
          git push origin HEAD:seo-aeo-geo-polish-20260830
