ro hero-managed">\n    <div class="info-updated">정보 업데이트 2026.09.07 · 2026–27 에듀스마트 최신 프로그램 비용표 기준</div>\n    <div class="kicker">NORTH VANCOUVER · PUBLIC</div>\n    <h1>노스밴쿠버 공립<br><span>아카데믹 관리형 (G9~11)</span></h1>\n    <p class="lead">노스밴쿠버 공립 세컨더리에서 정규수업을 듣고, 캐네디언 홈스테이와 에듀스마트의 아카데믹 관리를 결합한 Grade 9~11 대상 10개월 관리형 프로그램입니다.</p>\n    <div class="hero-tags"><span>👤 Grade 9~11</span><span>📍 North Vancouver, BC</span><span>🏡 캐네디언 홈스테이</span><span>💰 CA$71,700 · 10개월</span></div>\n    <div class="hero-note">학교 선택은 Handsworth Secondary, Argyle Secondary, Sutherland Secondary를 중심으로 검토하며 실제 배정 가능 여부는 지원 시점에 확인합니다.</div>\n  </div>\n  <section>\n    <span class="section-label">PROGRAM SNAPSHOT</span><h2>한눈에 보는 프로그램 개요</h2>\n    <div class="facts">\n      <div class="fact"><div class="icon">🎒</div><div class="label">대상 학년</div><div class="value">Grade 9~11</div></div>\n      <div class="fact"><div class="icon">🏫</div><div class="label">학교 옵션</div><div class="value">Handsworth · Argyle · Sutherland</div></div>\n      <div class="fact"><div class="icon">🏡</div><div class="label">숙소</div><div class="value">캐네디언 홈스테이</div></div>\n      <div class="fact"><div class="icon">💰</div><div class="label">프로그램 비용</div><div class="value">CA$71,700 · 10개월</div></div>\n    </div>\n  </section>\n  <section>\n    <span class="section-label">SCHOOL OPTIONS</span><h2>노스밴쿠버 공립학교 3개 선택지</h2>\n    <p class="prose">Handsworth Secondary, Argyle Secondary, Sutherland Secondary는 모두 North Vancouver School District 소속 세컨더리 스쿨입니다. 학교별 과목 구성과 자리가 다르므로 학생의 학년·성적·진학 목표에 맞춰 지원 시점에 우선순위를 정합니다.</p>\n    <div class="trio">\n      <div class="card"><div class="icon">🏫</div><div class="title">Handsworth Secondary</div><div class="desc">North Vancouver School District 공립 세컨더리</div></div>\n      <div class="card"><div class="icon">🏫</div><div class="title">Argyle Secondary</div><div class="desc">North Vancouver School District 공립 세컨더리</div></div>\n      <div class="card"><div class="icon">🏫</div><div class="title">Su