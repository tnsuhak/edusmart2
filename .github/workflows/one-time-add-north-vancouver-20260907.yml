name: One-time add North Vancouver programs

on:
  push:
    branches: [seo-aeo-geo-polish-20260830]
    paths:
      - '.github/workflows/one-time-add-north-vancouver-20260907.yml'

permissions:
  contents: write

jobs:
  expand:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: seo-aeo-geo-polish-20260830
          fetch-depth: 0
      - name: Add two North Vancouver managed programs
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          root = Path('.')
          htmls = sorted(root.glob('*.html'))

          # 1) Shared navigation/count updates across existing pages.
          nav_insert = '''        <a href="north-vancouver-public.html">노스밴쿠버 공립 관리형<small>G9~11 · Handsworth·Argyle·Sutherland</small></a>\n        <a href="north-vancouver-private.html">노스밴쿠버 사립 관리형<small>G9~11 · St. Thomas Aquinas</small></a>\n'''
          for p in htmls:
              s = p.read_text(encoding='utf-8')
              s = s.replace('관리형 6개 + 가디언형 5개 선택지', '관리형 8개 + 가디언형 5개 선택지')
              s = s.replace('관리형 6개 프로그램', '관리형 8개 프로그램')
              s = s.replace('일반 관리형 6개', '일반 관리형 8개')
              s = s.replace('11개 선택지 보기', '13개 선택지 보기')
              if 'north-vancouver-public.html' not in s:
                  m = re.search(r'(?m)^(\s*<a href="burnaby\.html"[^\n]*\n)', s)
                  if m:
                      s = s[:m.end()] + nav_insert + s[m.end():]
              p.write_text(s, encoding='utf-8')

          # 2) Homepage: 13 choices, 8 managed programs, new rows, current managed range.
          p = root/'index.html'
          s = p.read_text(encoding='utf-8')
          s = s.replace('VANCOUVER · 11 OPTIONS', 'VANCOUVER · 13 OPTIONS')
          s = s.replace('조기유학 11개 선택지', '조기유학 13개 선택지')
          s = s.replace('CA$58,500~80,700', 'CA$58,500~82,375')
          if 'north-vancouver-public.html' not in s[s.find('<section>'):]:
              pass
          # Insert new managed rows immediately after the Burnaby managed row.
          if '노스밴쿠버 공립 아카데믹 관리형' not in s:
              pat = re.compile(r'(<tr>\s*<td class="school"><a href="burnaby\.html".*?</tr>)', re.S)
              m = pat.search(s)
              rows = '''\n      <tr>\n        <td class="school"><a href="north-vancouver-public.html" style="text-decoration:none;">노스밴쿠버 공립 아카데믹 관리형</a><span>North Vancouver · Handsworth / Argyle / Sutherland</span></td>\n        <td>G9~11</td>\n        <td>홈스테이</td>\n        <td>71,700<span class="krw">약 7,170만 원</span></td>\n      </tr>\n      <tr>\n        <td class="school"><a href="north-vancouver-private.html" style="text-decoration:none;">노스밴쿠버 사립 아카데믹 관리형</a><span>North Vancouver · St. Thomas Aquinas Regional Secondary</span></td>\n        <td>G9~11</td>\n        <td>홈스테이</td>\n        <td>82,375<span class="krw">약 8,238만 원</span></td>\n      </tr>'''
              if m:
                  s = s[:m.end()] + rows + s[m.end():]
          s = s.replace('"dateModified": "2026-09-03"', '"dateModified": "2026-09-07"', 1)
          s = s.replace('정보 업데이트 2026.09.03', '정보 업데이트 2026.09.07', 1)
          p.write_text(s, encoding='utf-8')

          # 3) Managed overview page: updated range + two new cards.
          p = root/'supervised.html'
          s = p.read_text(encoding='utf-8')
          s = s.replace('CA$58,500~80,700', 'CA$58,500~82,375')
          if 'NORTH VANCOUVER · PUBLIC' not in s:
              anchor = '<a href="burnaby.html"><div class="rg">BURNABY · G8~11</div><div class="rn">아카데믹 관리형</div><div class="rd">도심 접근성 · 아카데믹 프로그램 상담</div></a>'
              cards = anchor + '\n      <a href="north-vancouver-public.html"><div class="rg">NORTH VANCOUVER · PUBLIC</div><div class="rn">공립 아카데믹 관리형</div><div class="rd">G9~11 · Handsworth·Argyle·Sutherland · CA$71,700</div></a>\n      <a href="north-vancouver-private.html"><div class="rg">NORTH VANCOUVER · PRIVATE</div><div class="rn">사립 아카데믹 관리형</div><div class="rd">G9~11 · St. Thomas Aquinas · CA$82,375</div></a>'
              s = s.replace(anchor, cards)
          s = s.replace('"dateModified": "2026-09-03"', '"dateModified": "2026-09-07"', 1)
          s = s.replace('정보 업데이트 2026.09.03', '정보 업데이트 2026.09.07', 1)
          s = s.replace('최종 확인: 2026년 8월 30일.', '최종 확인: 2026년 9월 7일.')
          p.write_text(s, encoding='utf-8')

          # 4) Guardian comparison page only needs the expanded managed-program range.
          p = root/'guardian.html'
          s = p.read_text(encoding='utf-8').replace('CA$58,500~80,700', 'CA$58,500~82,375')
          p.write_text(s, encoding='utf-8')

          # 5) Quick Finder: add both new options.
          p = root/'nav.js'
          s = p.read_text(encoding='utf-8')
          if "north-vancouver-public.html" not in s:
              needle = "    {name:'버나비 아카데믹 관리형', minGrade:8, maxGrade:11, minCost:58500, cost:'CA$58,500', care:2, href:'burnaby.html', reason:'도심 접근성과 아카데믹 프로그램 상담을 함께 원하는 학생에게 적합'},"
              add = needle + "\n    {name:'노스밴쿠버 공립 아카데믹 관리형', minGrade:9, maxGrade:11, minCost:71700, cost:'CA$71,700', care:2, href:'north-vancouver-public.html', reason:'노스밴쿠버 공립학교와 홈스테이 생활, 아카데믹 관리를 함께 원하는 학생에게 적합'},\n    {name:'노스밴쿠버 사립 아카데믹 관리형', minGrade:9, maxGrade:11, minCost:82375, cost:'CA$82,375', care:2, href:'north-vancouver-private.html', reason:'가톨릭 사립학교 환경과 홈스테이, 아카데믹 관리를 함께 원하는 학생에게 적합'},"
              s = s.replace(needle, add)
          p.write_text(s, encoding='utf-8')

          # Shared navigation used by the two new pages.
          def menu(active):
              items = [
                ('supervised.html','관리형이란?','학업·생활관리 범위 안내'),
                ('dorm-young.html','코퀴틀람 기숙사','G5~7 · 생활관리 중심'),
                ('dorm-junior.html','코퀴틀람 기숙사','G7~11 · 내신·입시 중심'),
                ('homestay.html','코퀴틀람 홈스테이','G7~11 · 현지 가정 생활'),
                ('golf.html','주니어 골프','G6~11 · 골프+학업 병행'),
                ('langley.html','랭리 관리형','G8~11 · 대학 입시 전문'),
                ('burnaby.html','버나비 관리형','G8~11 · AP·IB 아카데믹'),
                ('north-vancouver-public.html','노스밴쿠버 공립 관리형','G9~11 · Handsworth·Argyle·Sutherland'),
                ('north-vancouver-private.html','노스밴쿠버 사립 관리형','G9~11 · St. Thomas Aquinas'),
              ]
              out = ['<nav class="gnav">','  <div class="gnav-inner">','    <a class="gnav-brand" href="index.html"><span class="dot"></span>TNS유학 · 캐나다 조기유학</a>','    <details class="gnav-menu">',f'      <summary>{"노스밴쿠버 공립 관리형" if active=="public" else "노스밴쿠버 사립 관리형"} <span class="caret">▼</span></summary>','      <div class="gnav-panel">','        <div class="grp">전체</div>','        <a href="index.html" class="wide">전체 프로그램 비교<small>관리형 8개 + 가디언형 5개 선택지</small></a>','        <div class="grp grp-managed">관리형 유학</div>']
              for href,name,small in items:
                  cls = ' class="active"' if (active=='public' and href=='north-vancouver-public.html') or (active=='private' and href=='north-vancouver-private.html') else ''
                  out.append(f'        <a href="{href}"{cls}>{name}<small>{small}</small></a>')
              out += ['        <div class="grp grp-guardian">가디언형 유학</div>','        <a href="guardian.html">가디언형이란?<small>관리형과 정면 비교</small></a>','        <a href="guardian-metro.html">버나비·랭리·코퀴틀람<small>G8~11 · 3개 교육청</small></a>','        <a href="guardian-chilliwack.html">칠리왁 공립교육청<small>G9~11 · 영어 중심 지역</small></a>','        <a href="guardian-highroad.html">칠리왁 하이로드 아카데미<small>G8~11 · 소규모 기독교 사립</small></a>','      </div>','    </details>','  </div>','</nav>']
              return '\n'.join(out)

          contact = '''  <section>\n    <span class="section-label">CONTACT</span>\n    <h2>상담이 필요하신가요?</h2>\n    <div class="cta-box">\n      <div class="cta-title">학년과 학교 성향부터 비교해 드립니다</div>\n      <div class="cta-sub">공립·사립 차이, 예산, 홈스테이와 관리 범위를 함께 확인해 보세요.</div>\n      <div class="cta-btns">\n        <a class="kakao" href="https://open.kakao.com/o/slehLvKi" target="_blank" rel="noopener"><span class="ico">💬</span><span class="txt-wrap"><span class="lb">카톡 상담</span><br><span class="sb">1:1 실시간 문의</span></span></a>\n        <a class="phone" href="tel:01051500105" aria-label="TNS유학 전화상담 010-5150-0105"><span class="ico">📞</span><span class="txt-wrap"><span class="lb">전화상담</span><br><span class="sb">010-5150-0105</span></span></a>\n        <a class="naver" href="https://cafe.naver.com/tnsuhak.cafe" target="_blank" rel="noopener"><span class="ico">🇳</span><span class="txt-wrap"><span class="lb">네이버 유학카페</span><br><span class="sb">회원 43,000명</span></span></a>\n        <a class="home" href="index.html"><span class="ico">↔</span><span class="txt-wrap"><span class="lb">전체 비교</span><br><span class="sb">13개 선택지 보기</span></span></a>\n      </div>\n    </div>\n  </section>'''

          footer = '''  <footer>\n    <div class="ft-brand">TNS유학 · 해대쉽</div>\n    <div class="ft-sub">강호진 부장(말랑이) · 유학 전문 경력 18년 · 네이버 유학카페 43,000명 운영</div>\n    <div class="ft-contact">📱 010-5150-0105 &nbsp;|&nbsp; ☎ 02-3288-1733~5<br>💬 카카오톡 ID : stardancer &nbsp;|&nbsp; 📧 khj@tnsuhak.com</div>\n    <div class="ft-tags"><span>#노스밴쿠버조기유학</span><span>#캐나다관리형유학</span><span>#밴쿠버조기유학</span></div>\n    <div class="disclaimer">현지 프로그램 운영 및 생활 관리: 에듀스마트 · 한국 상담 및 지원 절차 안내: TNS유학.<br>비용과 서비스는 2026–27학년도 기준이며 변경될 수 있습니다. 최종 확인: 2026년 9월 7일.</div>\n  </footer>'''

