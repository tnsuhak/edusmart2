name: One-time meeting insights update

on:
  push:
    branches:
      - meeting-insights-20260908
    paths:
      - .github/workflows/one-time-meeting-insights-20260908.yml

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: meeting-insights-20260908
      - name: Apply content update
        run: python3 .github/scripts/meeting_update.py
      - name: Commit update
        run: |
          git config user.name tnsuhak
          git config user.email tnsuhak@gmail.com
          git add supervised.html dorm-young.html homestay.html north-vancouver-public.html north-vancouver-private.html CONTENT_NOTES.md
          git rm .github/workflows/one-time-meeting-insights-20260908.yml .github/scripts/meeting_update.py
          git commit -m "Add operator meeting insights to managed study pages"
          git push origin HEAD:meeting-insights-20260908
