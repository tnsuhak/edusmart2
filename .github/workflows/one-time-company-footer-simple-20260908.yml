name: One-time company footer update

on:
  push:
    branches: [seo-aeo-geo-polish-20260830]
    paths: ['.github/workflows/one-time-company-footer-simple-20260908.yml']

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: seo-aeo-geo-polish-20260830
      - name: Replace personal footer with company footer
        run: |
          python3 - <<'PY'
          from pathlib import Path

          old_brand = '<div class="ft-brand">TNS유학 · 해대쉽</div>'
          old_sub = '<div class="ft-sub">강호진 부장(말랑이) · 유학 전문 경력 18년 · 네이버 유학카페 43,000명 운영</div>'
          old_contact = '''<div class="ft-contact">\n      📱 010-5150-0105 &nbsp;|&nbsp; ☎ 02-3288-1733~5<br>\n      💬 카카오톡 ID : stardancer &nbsp;|&nbsp; 📧 khj@tnsuhak.com\n    </div>'''

          new_brand = '<div class="ft-brand">TNS유학 · ㈜티앤에스월드와이드</div>'
          new_sub = '<div class="ft-sub">서울본사 · 부산지사 · Vancouver · Toronto · Calgary</div>'
          new_contact = '''<div class="ft-contact">\n      <b>서울본사</b> ☎ 02-3288-1733~1735 &nbsp;|&nbsp; <b>부산지사</b> ☎ 010-5024-1733<br>\n      📧 tns@tnsuhak.com &nbsp;|&nbsp; 🌐 tnsuhak.com\n    </div>'''

          changed = []
          for p in Path('.').glob('*.html'):
              s = p.read_text(encoding='utf-8')
              original = s
              s = s.replace(old_brand, new_brand)
              s = s.replace(old_sub, new_sub)
              s = s.replace(old_contact, new_contact)
              if s != original:
                  p.write_text(s, encoding='utf-8')
                  changed.append(p.name)

          if not changed:
              raise SystemExit('No footer blocks were changed')

          print('Updated:', ', '.join(changed))
          PY
          git config user.name "tnsuhak"
          git config user.email "tnsuhak@gmail.com"
          git add *.html
          git rm .github/workflows/one-time-company-footer-simple-20260908.yml
          git commit -m "Replace personal footer with TNS company contacts"
          git push origin HEAD:seo-aeo-geo-polish-20260830
